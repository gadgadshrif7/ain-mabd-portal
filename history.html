<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معالم وتاريخ عين معبد | بوابة عين معبد الرقمية</title>
    <meta name="description" content="صور ومعالم عين معبد ولاية الجلفة، جبل حواس، قعدة حواس، والمناظر الطبيعية والتراثية بالمنطقة.">
    <meta name="keywords" content="عين معبد, صور عين معبد, جبل حواس, قعدة حواس, معالم عين معبد, الجلفة">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ainmaabedport.onrender.com/history.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="معالم وتاريخ عين معبد | بوابة عين معبد الرقمية">
    <meta property="og:description" content="ألبوم صور معالم بلدية عين معبد الطبيعية والتاريخية.">
    <meta property="og:site_name" content="بوابة عين معبد الرقمية">

    <!-- أيقونة الموقع -->
    <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- خط Tajawal و Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- مكتبة Lightbox لعرض الصور بحجم أكبر عند الضغط عليها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">

    <style>
        :root {
            --primary: #059669;
            --accent: #d97706;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08);
            --topbar-bg: #0f172a;
            --footer-bg: #0b1329;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --topbar-bg: #020617;
            --footer-bg: #020617;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Navbar */
        .navbar {
            background: var(--topbar-bg);
            padding: 15px 20px;
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .navbar-container {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: var(--primary);
        }

        /* Hero Header */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #059669 100%);
            color: #fff;
            padding: 45px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero p {
            color: #cbd5e1;
            font-size: 1rem;
        }

        /* Container & Grid */
        .container {
            max-width: 1140px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .photo-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        /* شبكة الصور المتعددة داخل البطاقة */
        .multi-photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            background: var(--border-color);
            height: 230px;
            overflow: hidden;
        }

        .multi-photo-grid a, .single-photo a {
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .multi-photo-grid img, .single-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .multi-photo-grid a:hover img, .single-photo a:hover img {
            transform: scale(1.08);
        }

        /* إذا كانت الصورة واحدة فقط في البطاقة */
        .single-photo {
            width: 100%;
            height: 230px;
            overflow: hidden;
        }

        .photo-title {
            padding: 18px 20px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
        }

        .photo-title i {
            color: var(--accent);
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            background: var(--footer-bg);
            color: #94a3b8;
            padding: 30px 20px;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 1.7rem; }
            .gallery-grid { grid-template-columns: 1fr; }
            .multi-photo-grid, .single-photo { height: 200px; }
        }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-mountain-sun"></i> بوابة عين معبد الرقمية
            </a>
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>
    </nav>

    <!-- الهيدر الرئيسي -->
    <header class="hero">
        <h1>معالم وصور عين معبد</h1>
        <p>اضغط على أي صورة لفتحها وتكبيرها بحجم كامل</p>
    </header>

    <div class="container">
        
        <div class="gallery-grid">

            <!-- 1. جبل حجر الملح (بطاقة عدة صور مع التكبير) -->
            <div class="photo-card">
                <div class="multi-photo-grid">
                    <a href="https://i.ibb.co/Lzxp6kJH/1.png" data-lightbox="hawas" data-title="جبل حجر الملح - عين معبد">
                        <img src="https://i.ibb.co/Lzxp6kJH/1.png" alt="صورة 1">
                    </a>
                    <a href="https://i.ibb.co/v4wQYSn7/2.png" data-lightbox="hawas" data-title="جبل حجر الملح - عين معبد">
                        <img src="https://i.ibb.co/v4wQYSn7/2.png" alt="صورة 2">
                    </a>
                    <a href="https://i.ibb.co/qL32NcXL/3.png" data-lightbox="hawas" data-title="جبل حجر الملح - عين معبد">
                        <img src="https://i.ibb.co/qL32NcXL/3.png" alt="صورة 3">
                    </a>
                    <a href="https://i.ibb.co/7dXPZTGS/4.png" data-lightbox="hawas" data-title="جبل حجر الملح - عين معبد">
                        <img src="https://i.ibb.co/7dXPZTGS/4.png" alt="صورة 4">
                    </a>
                </div>
                <div class="photo-title">
                    <i class="fa-solid fa-mountain"></i> جبل حجر الملح
                </div>
            </div>

            <!-- 2. قعدة حواس -->
            <div class="photo-card">
                <div class="multi-photo-grid">
                    <a href="https://images.unsplash.com/photo-1506744038136-46273834b3fb" data-lightbox="gaada" data-title="قعدة حواس - عين معبد">
                        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="صورة 1">
                    </a>
                    <a href="https://images.unsplash.com/photo-1500382017468-9049fed747ef" data-lightbox="gaada" data-title="قعدة حواس - عين معبد">
                        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef" alt="صورة 2">
                    </a>
                </div>
                <div class="photo-title">
                    <i class="fa-solid fa-tree"></i> قعدة حواس
                </div>
            </div>

            <!-- 3. منبع عين معبد (صورة واحدة متكبرة) -->
            <div class="photo-card">
                <div class="single-photo">
                    <a href="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" data-lightbox="water" data-title="منبع عين معبد">
                        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="منبع عين معبد">
                    </a>
                </div>
                <div class="photo-title">
                    <i class="fa-solid fa-droplet"></i> منبع عين معبد
                </div>
            </div>

        </div>

    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 <strong>بوابة عين معبد الرقمية</strong></p>
    </footer>

    <!-- ملفات JavaScript الخاصة بمكتبة التكبير Lightbox -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

</body>
</html>
